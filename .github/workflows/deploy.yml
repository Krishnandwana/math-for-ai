name: Deploy to Krishnandwana.github.io

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Deploy to Krishnandwana.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: Krishnandwana/Krishnandwana.github.io
          publish_branch: main
          publish_dir: ./out
          user_name: Krish Nandwana
          user_email: krishnandwana@gmail.com
          commit_message: "Deploy math-for-ai build"
